<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMU Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="blog-wrap">
    <header class="blog-header">
      <div class="blog-title-row">
        <span class="blog-logo">B</span>
        <div>
          <h1 class="blog-title">SMU Blog</h1>
          <p class="blog-desc">week4 스프링 실습 블로그</p>
        </div>
      </div>
      <div class="server-row">
        <label for="base-url">서버 주소</label>
        <input id="base-url" type="text" value="http://localhost:8080" />
      </div>
    </header>

    <main>
      <section class="panel write-panel">
        <h2 class="panel-title">글쓰기</h2>
        <form id="create-form" class="write-form">
          <input id="create-title" class="write-title-input" type="text" placeholder="제목을 입력하세요" required />
          <textarea id="create-content" class="write-content-input" placeholder="내용을 입력하세요" required></textarea>
          <div class="write-actions">
            <button type="submit" class="btn btn-primary">등록</button>
          </div>
        </form>
        <p id="create-result" class="result"></p>
      </section>

      <section class="panel lookup-panel">
        <h2 class="panel-title">글 번호로 보기</h2>
        <form id="get-one-form" class="lookup-form">
          <input id="get-one-id" type="number" placeholder="글 번호" required />
          <button type="submit" class="btn btn-secondary">보기</button>
        </form>
        <article id="get-one-result" class="post-detail"></article>
      </section>

      <section class="panel update-panel">
        <h2 class="panel-title">글 수정</h2>
        <form id="update-form" class="write-form">
          <input id="update-id" class="update-id-input" type="number" placeholder="수정할 글 번호" required />
          <input id="update-title" class="write-title-input" type="text" placeholder="새 제목" required />
          <textarea id="update-content" class="write-content-input" placeholder="새 내용" required></textarea>
          <div class="write-actions">
            <button type="submit" class="btn btn-primary">수정</button>
          </div>
        </form>
        <p id="update-result" class="result"></p>
      </section>

      <section class="panel delete-panel">
        <h2 class="panel-title">글 삭제</h2>
        <form id="delete-form" class="lookup-form">
          <input id="delete-id" type="number" placeholder="삭제할 글 번호" required />
          <button type="submit" class="btn btn-danger">삭제</button>
        </form>
        <p id="delete-result" class="result"></p>
      </section>

      <section class="panel list-panel">
        <div class="list-panel-header">
          <h2 class="panel-title">전체 글</h2>
          <button id="list-btn" class="btn btn-secondary btn-small">새로고침</button>
        </div>
        <ul id="post-list" class="post-list"></ul>
      </section>
    </main>

    <footer class="blog-footer">SMU Blog &middot; week4 실습용 클라이언트</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
